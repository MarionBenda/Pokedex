<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/standard.css" />
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/fonts.css" />
    <link rel="stylesheet" href="./style/buttons.css" />
    <link rel="stylesheet" href="./style/dialog.css" />
    <link rel="stylesheet" href="./style/loading-spinner.css" />
    <link rel="stylesheet" href="./style/media-query.css" />

    <link
      rel="icon"
      type="image/png"
      href="./assets/img/pokeball-favicon.png"
    />
    <title>Pokedex</title>
  </head>
  <body>
    <header>
      <div class="header-content">
        <div class="header-logo">
          <img src="./assets/img/logo.png" alt="Logo Pokedex" />
          <h1>Pokedex</h1>
        </div>
        <div class="search-container">
          <input
            class="search-input"
            type="text"
            id="searchInput"
            placeholder="Suche..."
            onkeyup="searchPokemon()"
          />
        </div>
      </div>
    </header>
    <main>
      <section class="main-content">
        <div id="pokemon-container" class="pokemon-container">
          <p>Lade Pokémon...</p>
        </div>
      </section>
      <section class="load-content-area">
        <div id="spinner-overlay" class="loader-overlay">
          <img
            src="./assets/img/spinner.png"
            class="pokeball-spinner"
            alt="Laden..."
          />
        </div>
        <button class="load-btn" onclick="loadMore()">Mehr laden...</button>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <p>&copy; 2026 Pokedex - All Rights Reserved</p>
        <div class="footer-links">
          <a href="#">imprint</a>
          <a href="#">data protection</a>
          <a href="#">contact</a>
        </div>
      </div>
    </footer>
    <dialog id="pokeDialog" class="modal">
      <div class="modal-content">
        <!-- Neuer Header-Bereich -->
        <div class="modal-header">
          <h2 id="pokemon-title" class="pokemon-title-container">
            <!-- Wird per JS befüllt: #001 Bisasam -->
          </h2>
          <span class="close-btn" onclick="closeDialog()">&times;</span>
        </div>
        <div id="image-container" class="image-container">
          <img id="header-image" src="" style="width: 150px" />
        </div>
        <div id="dialog-type-icons" class="dialog-type-icons"></div>
        <!-- Tab-Header (Buttons) -->
        <div class="tab-header">
          <button
            class="tab-link active"
            onclick="openTab(event, 'main-container')"
          >
            Main
          </button>
          <button class="tab-link" onclick="openTab(event, 'stats-container')">
            Stats
          </button>
          <button class="tab-link" onclick="openTab(event, 'evo-container')">
            Entwicklung
          </button>
        </div>

        <div id="main-container" class="tab-content"></div>
        <div id="stats-container" class="tab-content"></div>
        <div id="evo-container" class="tab-content evo-container-list"></div>
      </div>
    </dialog>
  </body>
  <script src="./scripts/db.js"></script>
  <script src="./scripts/templates.js"></script>
  <script src="./scripts/scripts.js"></script>
</html>
